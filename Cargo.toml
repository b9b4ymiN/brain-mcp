[package]
name = "llm-wiki-engine"
version = "0.4.15"
edition = "2024"
rust-version = "1.95"
description = "Git-backed wiki engine with MCP/ACP server — bring your own LLM"
authors = ["Jerome Guibert <jguibert@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/hataichanokpan-dev/brain-mcp"
homepage = "https://github.com/hataichanokpan-dev/brain-mcp"
documentation = "https://docs.rs/llm-wiki-engine"
readme = "README.md"
keywords = ["wiki", "knowledge-base", "mcp", "git", "acp"]
categories = ["command-line-utilities", "development-tools"]
exclude = [".github/", "tests/", "tests-integration/", "docs/"]

[lib]
name = "llm_wiki"
path = "src/lib.rs"

[features]
default = []
semantic-test-failpoints = []
# Live regression test against a real SemanticStore at BRAIN_STORE_PATH.
# Off by default; opt in with `cargo test --features live_regression`.
live_regression = []

[[bin]]
name = "llm-wiki"
path = "src/main.rs"

[dependencies]
# CLI
clap       = { version = "4", features = ["derive"] }
anyhow     = "1"
tracing    = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"

# HTTP client (Task D1 — Z.ai adapter transport)
reqwest    = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

# Async
tokio      = { version = "1", features = ["full"] }

# Serialization
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml       = "1.1"
serde_jcs  = "=0.2.0"

# JSON Schema validation
jsonschema = "0.46"

# Hashing
sha2       = "0.11"
hex        = "0.4"

# Regex
regex      = "1"

# Unicode (subject validator Layer 0: NFC normalize, UAX#29 word boundaries)
unicode-normalization = "0.1"
unicode-segmentation  = "1.12"

# Markdown
# (frontmatter crate removed — unused, pulled in unmaintained yaml-rust)

# Full-text search
tantivy    = "0.26"

# Graph
petgraph   = "0.8"
petgraph-live = { version = "0.3.1", features = ["snapshot-lz4", "snapshot-zstd"] }

# Filesystem traversal
walkdir    = "2"

# Date/time
chrono     = { version = "0.4", default-features = false, features = ["clock", "std"] }

# Git
git2       = { version = "0.21", default-features = false, features = ["vendored-libgit2"] }

# MCP server
rmcp       = { version = "1.7", features = ["server", "transport-io", "transport-streamable-http-server"] }
axum       = "0.8"
# Console static-file serving (ServeDir) + uniform CSP header (SetResponseHeaderLayer) — Task E0.3
tower-http = { version = "0.6", features = ["fs", "set-header"] }
# broadcast::Receiver -> Stream adapter for the SSE /events endpoint (BroadcastStream) — Task E0.3
tokio-stream = { version = "0.1", features = ["sync"] }

# Concurrency (non-poisoning locks)
parking_lot = "0.12"

# UUID generation
uuid = { version = "1", features = ["v4", "v7", "serde"] }

# Isolated semantic authority spike (Task 0.3)
rusqlite = { version = "=0.40.1", features = ["bundled"] }

# Object-at-rest encryption for crypto-shred purge (Task 1.2b)
aes-gcm = "0.10"

# ACP server
agent-client-protocol = "0.12"
tokio-util = { version = "0.7", features = ["compat"] }
notify = "8"
metrics = "0.24.6"
metrics-exporter-prometheus = "0.18.3"

[dev-dependencies]
tempfile   = "3"
# `ServiceExt::oneshot` for driving a `Router` directly in integration tests
# without spinning up a real TCP server (axum 0.8's re-exported `ServiceExt`
# is a different trait without `oneshot`). Pinned to the version already in
# the lockfile as a transitive dep of axum — no version drift introduced.
tower     = "0.5"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem"] }

# Direct dependency for `statfs()` filesystem magic detection in src/watch.rs
# (watcher bind-mount reliability, 2026-07-25). Already a transitive dep via
# notify on Linux; pinned as direct because we use the libc::statfs API
# surface directly. statfs is a Linux syscall, so the cfg gate matters.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[profile.release]
opt-level      = 3
lto            = true
codegen-units  = 1
strip          = true
panic          = "abort"

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ target }.tar.gz"
bin-dir = "llm-wiki"
