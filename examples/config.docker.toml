# examples/config.docker.toml
#
# Production-style config for Docker / Compose deployment
# (Phase F1.2 + Phase G 2026-07-20).
#
# Usage:
#   1. mkdir -p ./config ./data ./backups
#   2. cp examples/config.docker.toml ./config/config.toml
#   3. cp .env.example .env  # then edit USERNAME + PASSWORD
#   4. docker compose up -d --build
#
# The Console API is gated by a USERNAME + PASSWORD pair sourced from env
# vars (read by the Rust server at startup via std::env::var). The values
# are set in `.env` (gitignored) and forwarded into the container by
# docker-compose's `${USERNAME:-}` / `${PASSWORD:-}` substitution.
#
# Tradeoff: env-var credentials land in `docker inspect Config.Env`. This is
# acceptable for dev-grade auth behind a loopback-only publish + TLS fronting
# proxy. For higher-stakes deployments, restore the legacy Docker-secret path:
# comment out the env-var lines below, uncomment the *_secret_file line, and
# keep using the secrets/ bind mount (mode 0600 on the host). Priority:
# password-env > secret-file > direct-string.

[serve]
# HTTP transport on. ACP (stdio bridge) off for the docker shape.
http = true
http_port = 8080
# Bind 0.0.0.0 INSIDE the container; the host-side publish stays
# loopback-only (compose: "127.0.0.1:8080:8080"). A reverse proxy with TLS
# (nginx / caddy) MUST sit in front for any non-loopback exposure.
http_bind_address = "0.0.0.0"
http_bind_all_interfaces = true
acp = false

# Console SPA — baked into the image at /app/web/console/dist by the
# console-builder stage of the Dockerfile.
console_static_dir = "/app/web/console/dist"

# Console dev credentials (Phase G, 2026-07-20).
#
# The Console API is gated by a BRAIN_USERNAME + BRAIN_PASSWORD pair read
# from env vars at startup. Defaults: env vars named `BRAIN_USERNAME` and
# `BRAIN_PASSWORD`. Override the env-var names here if you prefer different
# keys.
#
#   console_dev_bootstrap_username_env = "CONSOLE_USER"
#   console_dev_bootstrap_password_env = "CONSOLE_PW"
#
# The credential values themselves are NEVER in this file — only the names
# of the env vars to read. They land in `docker inspect Config.Env` (same
# tradeoff as ZAI_API_KEY). For higher-stakes deployments, restore the
# legacy Docker-secret path:
#
#   console_dev_bootstrap_secret_file = "/run/secrets/bootstrap_secret"
#
# …and unset BRAIN_PASSWORD — the server falls back to the file when the
# password env var is absent. Priority: password-env > secret-file >
# direct-string.
#
# Why BRAIN_* and not bare USERNAME/PASSWORD? Bare USERNAME collides with
# the Windows built-in env var (always set to the host user's login name),
# which silently overrides `.env` via docker-compose substitution. Found
# live 2026-07-20.
console_dev_bootstrap_username_env = "BRAIN_USERNAME"
console_dev_bootstrap_password_env = "BRAIN_PASSWORD"

[logging]
# JSON log lines for container log aggregators (Loki / Datadog / CloudWatch).
# Switch to "text" for easier `docker logs` reading during local dev.
log_format = "json"
# Log files inside the container (under /data/logs via state_dir derivation).
# In production prefer stdout (the default `docker logs` surface) and only
# enable file logging if you have a log shipper picking these up.
log_rotation = "daily"
log_max_files = 7

# ── Wiki space registration ────────────────────────────────────────────────
#
# `spaces create` via MCP cannot write this file (bind-mounted :ro by design)
# — register spaces here manually, then `docker restart brain`. Scaffold lives
# on the writable /data volume.
[global]
default_wiki = "brain"

[[wikis]]
name = "brain"
path = "/data/wikis/brain"

# ── [provider] (optional) ──────────────────────────────────────────────────

# [provider]
# Optional AI provider wiring for the `brain_extract`/`brain_propose` MCP
# tools (external-source claim extraction). Disabled by default — omit this
# whole section (or leave enabled = false) and those two tools simply return
# "AI provider not configured", every other tool is unaffected.
#
# The API key itself is NEVER put in this file — only the name of an
# environment variable the server reads at call time (`api_key_env`, resolved
# as `env:<name>`, same "never bake a secret into a tracked file" rule as the
# bootstrap secret above). Set the actual key via a Docker secret / compose
# `environment:` entry outside this file.
#
# enabled = true
# base_url = "https://api.z.ai/api/coding/paas/v4/chat/completions"
# api_key_env = "ZAI_API_KEY"
# routine_model = "glm-4.6"
# reasoning_model = "glm-4.6"
# # max_tokens budget for a brain_extract provider call (default 8192).
# # Reasoning models (glm-4.6/glm-5.2 and similar) spend completion tokens on
# # a reasoning_content chain-of-thought BEFORE writing the final answer into
# # content — too low a budget returns finish_reason:"length" with an EMPTY
# # content, which fails as an unparseable-JSON error rather than an obvious
# # "ran out of tokens" one. Bump this if brain_extract fails that way.
# extraction_max_tokens = 8192
# # §8.2 compliance acknowledgement — REQUIRED (non-empty) when enabled=true;
# # the server refuses to wire the provider without it (fail-closed, not a
# # default placeholder). Fill these in with what the operator actually
# # decided before setting enabled = true.
# compliance_user_decision = ""
# compliance_known_terms_risk = ""
# compliance_retention_terms = "unconfirmed"
# compliance_training_terms = "unconfirmed"
# compliance_processing_region = "unconfirmed"
