# Brain MCP — Docker Compose (Phase F1.2 + Phase G 2026-07-20)
#
# Single-service production-style stack. A reverse proxy (nginx / caddy /
# Traefik) with TLS MUST sit in front of the published 127.0.0.1:8080 port
# for any non-loopback exposure — the Console API is bootstrap-credential
# gated, not OAuth-gated, until Phase F2.
#
# Bootstrap credentials (Phase G, 2026-07-20): the Console API is gated by
# a USERNAME + PASSWORD pair read from env vars at startup. The credential
# values land in `docker inspect` Config.Env, same as ZAI_API_KEY — this is
# a deliberate tradeoff:
#   - Pro: trivial setup (just edit `.env`); operators can rotate without
#     re-issuing Docker secrets.
#   - Con: anyone who can `docker inspect brain` can read the credentials.
#     Restrict via Docker access controls + a TLS fronting proxy.
# The legacy `console_dev_bootstrap_secret_file` path (Docker-secret bind
# mount) still works as a fallback if `PASSWORD` is unset, but the new
# env-var flow is the recommended default.
#
# Config layout: the operator's config.toml is bind-mounted at
# `/data/config.toml` (NOT `/config/`). This matches the F1.1 finding — the
# binary derives `state_dir = config_path.parent()` and writes the semantic
# store + indexes into that directory, so config MUST live inside the
# writable data volume. See `src/engine.rs:102` and the F1.1 runbook
# (`docs/guides/deploy-docker.md`).

services:
  brain:
    # Built fresh from the repo Dockerfile on `docker compose up --build`.
    # Pin to a release tag (e.g. `brain:v0.5`) in production and drop the
    # `build:` block to deploy a pre-built image from a registry.
    # v0.11-watcher-fix (2026-07-25): statfs-based watcher backend selection
    # — auto-fallback to PollWatcher on Docker Desktop bind mounts / NFS / SMB
    # / FUSE; RecommendedWatcher on local Linux. See
    # docs/specs/2026-07-25-watcher-bind-mount-fix-design.md.
    image: brain:v0.11-watcher-fix
    build:
      context: .
      dockerfile: Dockerfile
    container_name: brain
    # Explicit at the compose layer so operators reading this file see the
    # watcher is on. Matches the Dockerfile CMD default (Layer 2 — see
    # src/watch.rs). Override per-deployment if you want the watcher off.
    command: ["serve", "--http", ":2901"]
    # Loopback-only publish. For any non-local access, put a reverse proxy
    # (nginx/caddy) in front that terminates TLS and forwards to 127.0.0.1:8080.
    ports:
      - "0.0.0.0:2901:2901"
    volumes:
      # Semantic store + indexes + state. Must be writable by uid 1000 (brain).
      - ./data:/data
      # Encrypted backup snapshots (Phase F3.1). Writable by uid 1000.
      - ./backups:/backups
      # Operator's config — single-file bind mount inside the writable /data
      # volume (see header comment for the state_dir rationale).
      - ./config/config.toml:/data/config.toml:ro
      # Subject Validator v1 rules (Phase 1.5) — bind mount the host rules/
      # directory so operators can edit verdicts / denylists / allowlists
      # without rebuilding the image. Override of the COPY'd fallback in
      # /app/rules. The binary looks for "rules/" relative to cwd (/data),
      # then falls back to include_str!-embedded copies — this mount makes
      # the relative lookup succeed.
      - ./rules:/data/rules:ro
      # Console bootstrap secret (Phase G). Optional if BRAIN_USERNAME+PASSWORD
      # are set; this takes priority when present.
      - ./secrets:/run/secrets:ro
    environment:
      # tracing filter — adjust per-operator preference.
      - RUST_LOG=llm_wiki=info,warn
      # Path to the bind-mounted config. The binary's `--config` flag is the
      # authoritative source (CMD in Dockerfile); LLM_WIKI_CONFIG is the
      # documented env fallback the CLI reads when `--config` is absent.
      - LLM_WIKI_CONFIG=/data/config.toml
      # Console login credentials (Phase G). Sourced from `.env` via compose
      # substitution. Namespaced as BRAIN_* (not bare USERNAME/PASSWORD)
      # because bare USERNAME collides with the Windows built-in env var
      # (always set to the host user's login name) and silently overrides
      # the `.env` value. Found live 2026-07-20.
      # Both land in `docker inspect` Config.Env — acceptable for dev-grade
      # auth behind a loopback-only publish + TLS proxy. Keep the secrets/
      # directory + bootstrap_secret.txt around if you prefer the legacy
      # Docker-secret path; config.toml's *_secret_file field still wins
      # when BRAIN_PASSWORD is unset.
      - BRAIN_USERNAME=${BRAIN_USERNAME:-}
      - BRAIN_PASSWORD=${BRAIN_PASSWORD:-}
      # Optional AI provider key for brain_extract/brain_propose ([provider]
      # section in config.toml). Sourced from a gitignored `.env` file via
      # compose variable substitution; ZAI_API_KEY is never written to any
      # tracked file. Omit this line entirely (and leave [provider]
      # disabled) if you don't want the key in the container's inspectable
      # environment.
      - ZAI_API_KEY=${ZAI_API_KEY:-}
      # MCP Bearer tokens (comma-separated, multi-client). Required when
      # exposing /mcp publicly (http_bind_all_interfaces=true). Loopback
      # deployments can leave this unset for backward-compatible no-auth.
      - BRAIN_MCP_TOKENS=${BRAIN_MCP_TOKENS:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:2901/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
